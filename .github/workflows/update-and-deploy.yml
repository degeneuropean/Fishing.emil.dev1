name: Daten aktualisieren und GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "wasserwerte.json"
  schedule:
    # Alle sechs Stunden. GitHub Actions verwendet für Cron-Zeiten UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Daten aktualisieren und Seite bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wasser- und Pegeldaten aktualisieren
        run: python update_data.py

      - name: Datenbestand prüfen
        run: python update_data.py --validate-only

      - name: Aktualisierte Messdaten sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations.json data/quality wasserwerte.json
          if ! git diff --cached --quiet; then
            git commit -m "Messdaten automatisch aktualisiert [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Veröffentlichbare Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html app.js ui.js styles.css wasserwerte.json _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Seite veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
