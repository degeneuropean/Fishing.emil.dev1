name: Daten aktualisieren und GitHub Pages veröffentlichen

on:
  push:
    branches:
      - main
  schedule:
    # Alle sechs Stunden. GitHub Actions verwendet für Cron-Zeiten UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Daten aktualisieren und Seite bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Browser für den Datenabruf installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Wasserwerte aktualisieren
        run: python fetch_wasserwerte.py

      - name: Aktualisierte Daten prüfen
        run: |
          python -m json.tool wasserwerte.json > /dev/null
          test -s wasserwerte.json

      - name: Veröffentlichbare Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html app.js styles.css wasserwerte.json _site/
          touch _site/.nojekyll

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Seite veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
