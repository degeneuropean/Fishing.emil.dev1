name: Wasserwerte aktualisieren und Seite veröffentlichen

on:
  push:
    branches:
      - main

  schedule:
    - cron: "17 */6 * * *"
      timezone: "Europe/Berlin"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python vorbereiten
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Playwright installieren
        if: github.event_name != 'push'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wasserwerte aktualisieren
        if: github.event_name != 'push'
        run: python fetch_wasserwerte.py

      - name: Seite vorbereiten
        run: |
          mkdir _site
          cp index.html wasserwerte.json _site/

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
